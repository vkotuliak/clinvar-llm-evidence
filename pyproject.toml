[project]
name = "clinvar-llm-evidence"
version = "0.2.0"
description = "Can LLMs classify genetic variants from the literature ClinVar cites? Pipeline + benchmark."
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
